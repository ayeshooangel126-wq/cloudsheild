<!DOCTYPE html>
<html>
<head>
    <title>CloudShield</title>
    <style>
        * { margin:0; padding:0; box-sizing:border-box; }
        body {
            background:#0a1628;
            font-family:'Segoe UI',sans-serif;
            display:flex;
            justify-content:center;
            align-items:center;
            min-height:100vh;
            padding:20px;
        }
        .container {
            background:#132b5a;
            max-width:400px;
            padding:40px;
            border-radius:16px;
            border:1px solid #1a3b7a;
            width:100%;
        }
        h1 { color:#00d4ff; text-align:center; margin-bottom:8px; }
        .sub { color:#8899b0; text-align:center; margin-bottom:24px; }
        .form-group { margin-bottom:16px; }
        .form-group label { display:block; color:#c0d0e0; margin-bottom:6px; }
        .form-group input {
            width:100%; padding:12px; background:#0d1f3c;
            border:1px solid #1a3b7a; border-radius:8px; color:#e0e8f0;
        }
        .btn {
            width:100%; padding:12px; border:none; border-radius:8px;
            font-weight:bold; cursor:pointer;
        }
        .btn-primary { background:#00d4ff; color:#0a1628; }
        .btn-secondary { background:#7c4dff; color:white; margin-top:10px; }
        .alert {
            padding:10px; border-radius:8px; margin-bottom:16px; display:none;
        }
        .alert-success { background:#1b5e20; color:#a5d6a7; display:block; }
        .alert-danger { background:#b71c1c; color:#ef9a9a; display:block; }
        .links { text-align:center; margin-top:16px; color:#8899b0; }
        .links a { color:#00d4ff; text-decoration:none; }
        hr { border-color:#1a3b7a; margin:24px 0; }
    </style>
</head>
<body>
    <div class="container">
        <h1>🛡 CloudShield</h1>
        <p class="sub">Cloud Security Dashboard</p>
        <div id="alertBox" class="alert"></div>
        
        <form id="signupForm">
            <h3 style="color:#c0d0e0;margin-bottom:16px;">Create Account</h3>
            <div class="form-group">
                <label>Email</label>
                <input type="email" id="signupEmail" placeholder="your@email.com" required>
            </div>
            <div class="form-group">
                <label>Password</label>
                <input type="password" id="signupPassword" placeholder="Min 8 characters" required>
            </div>
            <button type="submit" class="btn btn-secondary">Sign Up</button>
        </form>

        <hr>

        <form id="loginForm">
            <h3 style="color:#c0d0e0;margin-bottom:16px;">Login</h3>
            <div class="form-group">
                <label>Email</label>
                <input type="email" id="loginEmail" placeholder="your@email.com" required>
            </div>
            <div class="form-group">
                <label>Password</label>
                <input type="password" id="loginPassword" placeholder="Enter password" required>
            </div>
            <button type="submit" class="btn btn-primary">Login</button>
        </form>

        <div class="links">
            <a href="#" onclick="document.getElementById('signupEmail').focus();">New user? Sign up</a>
        </div>
    </div>

    <script>
        function showAlert(type, message) {
            const box = document.getElementById('alertBox');
            box.className = 'alert alert-' + type;
            box.textContent = message;
            box.style.display = 'block';
            setTimeout(() => { box.style.display = 'none'; }, 8000);
        }

        document.getElementById('signupForm').addEventListener('submit', async function(e) {
            e.preventDefault();
            const email = document.getElementById('signupEmail').value;
            const password = document.getElementById('signupPassword').value;
            if (password.length < 8) {
                showAlert('danger', 'Password must be at least 8 characters');
                return;
            }
            const response = await fetch('/api/signup', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ email, password })
            });
            const data = await response.json();
            if (data.success) {
                showAlert('success', '✅ ' + data.message);
            } else {
                showAlert('danger', '❌ ' + data.message);
            }
        });

        document.getElementById('loginForm').addEventListener('submit', async function(e) {
            e.preventDefault();
            const email = document.getElementById('loginEmail').value;
            const password = document.getElementById('loginPassword').value;
            const response = await fetch('/api/login', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ email, password })
            });
            const data = await response.json();
            if (data.success) {
                showAlert('success', '✅ ' + data.message);
                setTimeout(() => window.location.href = '/dashboard', 1000);
            } else {
                showAlert('danger', '❌ ' + data.message);
            }
        });
    </script>
</body>
</html>
